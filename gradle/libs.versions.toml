# Every version is exact. Each was checked on Maven Central (and the project's own release page) on
# 13 November 2026.
[versions]
kafka = "4.4.0"
# kafka-streams 4.4.0 asks (through kafka-clients) for lz4-java 1.11.2 and snappy-java 1.1.10.7,
# which OSV lists with advisories (fixed in 1.11.4 and 1.1.10.9); the build constrains both to the
# newest, as Modules 28 and 30 do.
lz4 = "1.14.0"
snappy = "1.1.10.12"
# DuckDB 2.0.0 (released 21 October 2026); its JDBC driver 2.0.0.1 (31 October 2026) bundles it.
duckdb = "2.0.0.1"
h2 = "2.5.252"
jackson = "2.23.0"
slf4j = "2.0.20"
logback = "1.6.6"
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.11.0"
googleJavaFormat = "2.0.0"
jacoco = "0.8.16"

[libraries]
kafka-streams = { module = "org.apache.kafka:kafka-streams", version.ref = "kafka" }
kafka-streams-test-utils = { module = "org.apache.kafka:kafka-streams-test-utils", version.ref = "kafka" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
